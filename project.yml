name: DSHIOSApp
options:
  bundleIdPrefix: app.dsh.mobile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  DSHIOSApp:
    type: application
    platform: iOS
    sources:
      - path: DSHIOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dsh.mobile.client
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.3.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K9GJS8JXMH
    info:
      path: DSHIOSApp/Info.plist
      properties:
        CFBundleDisplayName: AI
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: DSH needs local network access when you connect to a server on your LAN.
        NSCameraUsageDescription: 需要使用相机来拍照并发送给 AI。
        NSPhotoLibraryUsageDescription: 需要访问相册来选择照片并发送给 AI。
        NSPhotoLibraryAddUsageDescription: 需要保存拍照结果到相册。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  DSHIOSAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DSHIOSAppTests
    dependencies:
      - target: DSHIOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dsh.mobile.client.tests
        GENERATE_INFOPLIST_FILE: YES
  DSHIOSAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DSHIOSAppUITests
    dependencies:
      - target: DSHIOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dsh.mobile.client.ui-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DSHIOSApp:
    build:
      targets:
        DSHIOSApp: all
        DSHIOSAppTests: [test]
        DSHIOSAppUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - DSHIOSAppTests
        - DSHIOSAppUITests
